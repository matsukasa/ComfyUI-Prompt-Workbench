<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../web/prompt_all_in_one.css">
  <title>Prompt Workbench settings hierarchy QA</title>
</head>
<body style="margin:0;background:#101210;color:#eee">
  <main id="mount" style="width:720px;margin:20px auto"></main>
  <output id="result" style="position:fixed;right:12px;bottom:12px;padding:7px 10px;border-radius:6px;background:#18351f;color:#dfffe6">LOADING</output>
  <script type="module">
    import { PromptEditor } from "../web/prompt_editor.js";

    const prompt = { name: "prompt", type: "text", value: "1girl, masterpiece", draw() {}, computeSize() { return [600, 120]; } };
    const node = {
      size: [720, 820],
      addDOMWidget(_name, _type, root) { document.querySelector("#mount").append(root); return {}; },
      setSize(size) { this.size = size; },
    };
    const api = {
      fetchApi(path) {
        if (path === "/prompt_all_in_one/examples") return fetch("../data/prompt_examples.json");
        return Promise.resolve(new Response(JSON.stringify({ loras: [], embeddings: [] }), { headers: { "content-type": "application/json" } }));
      },
    };
    const editor = new PromptEditor(node, { prompt }, api);
    [...document.querySelectorAll("button")].find((item) => item.textContent === "設定")?.click();
    [...document.querySelectorAll("button")].find((item) => item.textContent === "タグ管理")?.click();
    window.foldPass = false;
    window.setTimeout(() => {
      const before = document.querySelectorAll(".paio-library-tree-row").length;
      const large = document.querySelector(".paio-library-tree-row.is-large");
      large?.click();
      const after = document.querySelectorAll(".paio-library-tree-row").length;
      const collapsedLarge = document.querySelector(".paio-library-tree-row.is-large");
      window.foldPass = collapsedLarge?.getAttribute("aria-expanded") === "false" && after < before;
    }, 800);
    window.setTimeout(() => {
      document.querySelector(".paio-library-tree-row.is-large")?.click();
      document.querySelector(".paio-library-tree-row.is-small")?.click();
    }, 1100);
    window.batchSavePass = false;
    window.setTimeout(() => {
      const firstTag = document.querySelector(".paio-tag-edit-row .paio-search");
      if (!firstTag) return;
      firstTag.value = "1girl_custom";
      firstTag.dispatchEvent(new Event("input", { bubbles: true }));
      [...document.querySelectorAll(".paio-settings-dialog button")].find((item) => item.textContent === "変更を保存")?.click();
      window.batchSavePass = editor.settings.libraryEdits.tags.some((tag) => tag.prompt === "1girl_custom");
    }, 1500);
    window.setTimeout(() => {
      const treeRows = [...document.querySelectorAll(".paio-library-tree-row")];
      const unifiedManager = !document.querySelector(".paio-library-tabs");
      const fullHierarchy = ["large", "medium", "small"].every((level) => treeRows.some((item) => item.classList.contains(`is-${level}`)));
      const hanfuAbsent = !document.querySelector(".paio-settings-dialog")?.textContent.includes("漢服");
      const widgetHidden = prompt.hidden === true && prompt.computeSize()[1] < 0 && prompt.draw.toString().includes("=> {}");
      const tagEditor = Boolean(document.querySelector(".paio-tag-editor .paio-tag-add"));
      const searchLabel = document.querySelector(".paio-example-controls .paio-search")?.placeholder === "英語・日本語でタグを検索";
      const rowSaveAbsent = ![...document.querySelectorAll(".paio-tag-edit-row button")].some((item) => item.textContent === "保存");
      document.querySelector("#result").textContent = window.foldPass && window.batchSavePass && unifiedManager && fullHierarchy && hanfuAbsent && widgetHidden && tagEditor && searchLabel && rowSaveAbsent ? "PASS" : `FAIL fold=${window.foldPass} batch=${window.batchSavePass} unified=${unifiedManager} hierarchy=${fullHierarchy} hanfu=${hanfuAbsent} widget=${widgetHidden} tags=${tagEditor} search=${searchLabel} rowSaveAbsent=${rowSaveAbsent}`;
    }, 2000);
  </script>
</body>
</html>
