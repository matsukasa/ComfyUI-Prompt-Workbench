name: Update Danbooru tag catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-danbooru-tag-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install updater dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Test catalog updater
        run: python -m unittest tests.test_danbooru_catalog -v

      - name: Build catalog from official Danbooru API
        env:
          DANBOORU_USERNAME: ${{ secrets.DANBOORU_USERNAME }}
          DANBOORU_API_KEY: ${{ secrets.DANBOORU_API_KEY }}
        run: |
          if [ -z "$DANBOORU_USERNAME" ] || [ -z "$DANBOORU_API_KEY" ]; then
            echo "Required Danbooru repository secrets are not configured."
            exit 1
          fi
          python tools/update_danbooru_tag_catalog.py --refresh

      - name: Validate generated catalog
        run: python tools/validate_danbooru_tag_catalog.py

      - name: Upload generated catalog
        uses: actions/upload-artifact@v4
        with:
          name: danbooru-tag-catalog
          path: |
            data/danbooru_tag_catalog.json
            data/danbooru_tag_catalog_full.json
            docs/danbooru_tag_catalog.md
          if-no-files-found: error
          retention-days: 7
