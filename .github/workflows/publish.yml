name: Publish to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Registry package catalog preflight
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          import routes

          default_catalog = Path("data/tag_catalog.json")
          sfw_catalog = Path("data/sfw_tag_catalog.json")
          default_tag_sets = Path("data/tag_sets.json")
          sfw_tag_sets = Path("data/sfw_tag_sets.json")

          def load_catalog(path):
              if not path.is_file():
                  raise SystemExit(f"Missing required catalog: {path}")
              with path.open("r", encoding="utf-8") as handle:
                  catalog = json.load(handle)
              routes.validate_user_catalog(catalog)
              return catalog

          full = load_catalog(default_catalog)
          sfw = load_catalog(sfw_catalog)
          if full.get("stats", {}).get("catalog_profile") == "registry_sfw":
              raise SystemExit("data/tag_catalog.json is expected to be the local full catalog before packaging")
          if sfw.get("stats", {}).get("catalog_profile") != "registry_sfw":
              raise SystemExit("data/sfw_tag_catalog.json must declare stats.catalog_profile = registry_sfw")

          shutil.copyfile(sfw_catalog, default_catalog)
          packaged = load_catalog(default_catalog)
          if packaged.get("stats", {}).get("catalog_profile") != "registry_sfw":
              raise SystemExit("Registry package catalog replacement did not produce an SFW default catalog")
          print(
              "Registry package catalog is SFW:",
              f"tags={packaged.get('stats', {}).get('tags')}",
              f"source={sfw_catalog}",
              f"target={default_catalog}",
          )

          def load_tag_sets(path):
              if not path.is_file():
                  raise SystemExit(f"Missing required tag sets: {path}")
              with path.open("r", encoding="utf-8") as handle:
                  tag_sets = json.load(handle)
              routes.validate_user_tag_sets(tag_sets)
              return tag_sets

          full_sets = load_tag_sets(default_tag_sets)
          sfw_sets = load_tag_sets(sfw_tag_sets)
          if full_sets.get("stats", {}).get("tag_set_profile") == "registry_sfw":
              raise SystemExit("data/tag_sets.json is expected to be the local full tag sets before packaging")
          if sfw_sets.get("stats", {}).get("tag_set_profile") != "registry_sfw":
              raise SystemExit("data/sfw_tag_sets.json must declare stats.tag_set_profile = registry_sfw")

          shutil.copyfile(sfw_tag_sets, default_tag_sets)
          packaged_sets = load_tag_sets(default_tag_sets)
          if packaged_sets.get("stats", {}).get("tag_set_profile") != "registry_sfw":
              raise SystemExit("Registry package tag set replacement did not produce SFW defaults")
          print(
              "Registry package tag sets are SFW:",
              f"sets={packaged_sets.get('stats', {}).get('sets')}",
              f"source={sfw_tag_sets}",
              f"target={default_tag_sets}",
          )
          PY
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
