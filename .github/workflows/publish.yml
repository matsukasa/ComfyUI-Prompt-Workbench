name: Publish to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Registry package data preflight
        run: |
          python - <<'PY'
          from pathlib import Path

          excluded = {
              line.strip()
              for line in Path(".comfyignore").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          for path in ("data/tag_catalog.json", "data/tag_sets.json"):
              if path not in excluded:
                  raise SystemExit(f"Registry package must exclude {path} in .comfyignore")
              print(f"Registry package excludes {path}; download it separately from GitHub")
          PY
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
